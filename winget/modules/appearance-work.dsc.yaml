# yaml-language-server: $schema=https://aka.ms/dsc/schemas/v3/bundled/config/document.json
# Work appearance resources.
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: Work appearance
    type: Microsoft.Windows/RegistryList
    requireVersion: "=1.0.0"
    properties:
      registryEntries:
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
          valueName: AppsUseLightTheme
          valueData:
            DWord: 0
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
          valueName: SystemUsesLightTheme
          valueData:
            DWord: 0
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
          valueName: TaskbarAl
          valueData:
            DWord: 0
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
          valueName: TaskbarGlomLevel
          valueData:
            DWord: 0
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Search
          valueName: SearchboxTaskbarMode
          valueData:
            DWord: 0
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
          valueName: ShowTaskViewButton
          valueData:
            DWord: 1
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
          valueName: TaskbarDa
          valueData:
            DWord: 0
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
          valueName: HideFileExt
          valueData:
            DWord: 0
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
          valueName: AutoCheckSelect
          valueData:
            DWord: 0
        - keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
          valueName: ShowSecondsInSystemClock
          valueData:
            DWord: 1
  - name: Refresh work appearance
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    dependsOn:
      - "[resourceId('Microsoft.Windows/RegistryList', 'Work appearance')]"
    properties:
      executable: pwsh
      arguments:
        - -NoProfile
        - -NonInteractive
        - -Command
        - "$ErrorActionPreference = 'Stop'; $session = (Get-Process -Id $PID).SessionId; Get-Process explorer -ErrorAction SilentlyContinue | Where-Object SessionId -EQ $session | ForEach-Object { Stop-Process -Id $_.Id -Force }; Start-Process explorer.exe"
  - name: Desktop Background Spotlight
    type: Microsoft.Windows/Registry
    metadata:
      description: "Set desktop background to Windows Spotlight"
      module: "Microsoft.Windows"
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers
      valueName: BackgroundType
      valueData:
        DWord: 3
  - name: Deploy Taskbar Layout
    type: Microsoft.DSC.Transitional/PowerShellScript
    metadata:
      description: "Deploy managed taskbar pin layout via LayoutModification XML"
      module: "Microsoft.DSC.Transitional"
      winget:
        securityContext: "elevated"
    properties:
      input:
        gistBase: "https://gist.githubusercontent.com/matracey/f4c3a9194cd190a3b3de423aad5dc7e1/raw"
        fileName: "taskbarlayout.work.xml"
      testScript: |
        param($inputData)
        $layoutPath = 'C:\Users\Default\AppData\Local\Microsoft\Windows\Shell\LayoutModification.xml'
        return (Test-Path $layoutPath)
      setScript: |
        param($inputData)
        $layoutPath = 'C:\Users\Default\AppData\Local\Microsoft\Windows\Shell\LayoutModification.xml'
        $layoutDir = Split-Path $layoutPath
        if (-not (Test-Path $layoutDir)) { New-Item -ItemType Directory -Path $layoutDir -Force | Out-Null }
        # Resolve source: WinGetConfigRoot (winget configure) > PROVISION_MACHINE_ROOT (dsc.exe) > gist
        $roots = @($env:WinGetConfigRoot, $env:PROVISION_MACHINE_ROOT) | Where-Object { $_ }
        foreach ($root in $roots) {
          $localFile = Join-Path $root "..\provisioning\$($inputData.fileName)"
          if (Test-Path $localFile) {
            Copy-Item -Path $localFile -Destination $layoutPath -Force
            return
          }
        }
        $url = "$($inputData.gistBase)/$($inputData.fileName)"
        Invoke-WebRequest -Uri $url -OutFile $layoutPath -UseBasicParsing
