        - keyPath: HKCU\Software\Policies\Microsoft\Edge\ExtensionSettings\dppgmdbiimibapkepcbdbmkaabgiofem
          valueName: update_url
          valueData:
            String: https://edge.microsoft.com/extensionwebstorebase/v1/crx
