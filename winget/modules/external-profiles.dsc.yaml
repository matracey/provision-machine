# yaml-language-server: $schema=https://aka.ms/dsc/schemas/v3/bundled/config/document.json
# External user configuration repositories remain their own sources of truth.
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: Install PowerShell profile modules
    type: Microsoft.DSC.Transitional/PowerShellScript
    requireVersion: "=0.2.0"
    properties:
      input:
        modules:
          - posh-git
          - Terminal-Icons
      testScript: |
        param($inputData)
        foreach ($module in $inputData.modules) {
          if (-not (Get-Module -ListAvailable -Name $module)) { return $false }
        }
        return $true
      setScript: |
        param($inputData)
        $ErrorActionPreference = 'Stop'
        foreach ($module in $inputData.modules) {
          if (-not (Get-Module -ListAvailable -Name $module)) {
            Install-Module -Name $module -Scope CurrentUser -Force -AllowClobber
          }
        }
  - name: Install dotagents
    type: Microsoft.DSC.Transitional/PowerShellScript
    requireVersion: "=0.2.0"
    properties:
      input:
        repository: https://github.com/matracey/dotagents.git
        branch: main
        directory: .agents
        pythonIndex: https://packagefeedproxy.microsoft.io/pypi/simple/
      testScript: |
        param($inputData)
        . (Join-Path $env:PROVISION_MACHINE_ROOT 'scripts\ExternalRepository.ps1')
        $context = $env:PROVISION_MACHINE_CONTEXT
        if ($context -notin @('work', 'personal')) { throw 'Provisioning context is unavailable.' }
        $target = Join-Path $env:USERPROFILE $inputData.directory
        if (-not (Test-GitCheckout -Target $target -Repository $inputData.repository `
            -Ref "refs/heads/$($inputData.branch)")) { return $false }
        $marker = Join-Path $env:LOCALAPPDATA 'provision-machine\external-profiles\dotagents-context.txt'
        return (Test-Path -LiteralPath $marker) -and
          ((Get-Content -LiteralPath $marker -Raw).Trim() -eq $context)
      setScript: |
        param($inputData)
        $ErrorActionPreference = 'Stop'
        . (Join-Path $env:PROVISION_MACHINE_ROOT 'scripts\ExternalRepository.ps1')
        $context = $env:PROVISION_MACHINE_CONTEXT
        if ($context -notin @('work', 'personal')) { throw 'Provisioning context is unavailable.' }
        $target = Join-Path $env:USERPROFILE $inputData.directory
        Sync-GitCheckout -Target $target -Repository $inputData.repository -Branch $inputData.branch
        $env:UV_DEFAULT_INDEX = $inputData.pythonIndex
        $env:UV_PYTHON = Join-Path (& mise where python@3.14) 'python.exe'
        $env:UV_NO_MANAGED_PYTHON = '1'
        & mise exec --cd $target uv@latest python@3.14 node@lts bun@latest -- `
          uv run --python $env:UV_PYTHON --script (Join-Path $target 'install.py') --profile $context
        if ($LASTEXITCODE -ne 0) { throw "dotagents installation failed with exit code $LASTEXITCODE." }
        $marker = Join-Path $env:LOCALAPPDATA 'provision-machine\external-profiles\dotagents-context.txt'
        New-Item -ItemType Directory -Path (Split-Path $marker) -Force | Out-Null
        Set-Content -LiteralPath $marker -Value $context
  - name: Install PowerShell profile
    type: Microsoft.DSC.Transitional/PowerShellScript
    requireVersion: "=0.2.0"
    dependsOn:
      - "[resourceId('Microsoft.DSC.Transitional/PowerShellScript','Install PowerShell profile modules')]"
    properties:
      input:
        repository: https://github.com/matracey/PowerShell_Profile.git
        branch: main
        directory: .powershell-profile
        patterns:
          - "*.ps1"
          - "*.psm1"
          - powershell.config.json
      testScript: |
        param($inputData)
        . (Join-Path $env:PROVISION_MACHINE_ROOT 'scripts\ExternalRepository.ps1')
        $target = Join-Path $env:USERPROFILE $inputData.directory
        if (-not (Test-GitCheckout -Target $target -Repository $inputData.repository `
            -Ref "refs/heads/$($inputData.branch)")) { return $false }
        $documents = [Environment]::GetFolderPath('MyDocuments', 'DoNotVerify')
        if (-not $documents) { throw 'The Documents known folder could not be resolved.' }
        $destinations = @((Join-Path $documents 'PowerShell'), (Join-Path $documents 'WindowsPowerShell'))
        return Test-FileMirror -SourceRoot $target -DestinationRoots $destinations -Patterns $inputData.patterns
      setScript: |
        param($inputData)
        $ErrorActionPreference = 'Stop'
        . (Join-Path $env:PROVISION_MACHINE_ROOT 'scripts\ExternalRepository.ps1')
        $target = Join-Path $env:USERPROFILE $inputData.directory
        Sync-GitCheckout -Target $target -Repository $inputData.repository -Branch $inputData.branch
        $documents = [Environment]::GetFolderPath('MyDocuments', 'DoNotVerify')
        if (-not $documents) { throw 'The Documents known folder could not be resolved.' }
        $destinations = @((Join-Path $documents 'PowerShell'), (Join-Path $documents 'WindowsPowerShell'))
        Sync-FileMirror -SourceRoot $target -DestinationRoots $destinations -Patterns $inputData.patterns
  - name: Install Git configuration
    type: Microsoft.DSC.Transitional/PowerShellScript
    requireVersion: "=0.2.0"
    dependsOn:
      - "[resourceId('Microsoft.DSC.Transitional/PowerShellScript','Install dotagents')]"
    properties:
      input:
        gistId: 8ab9c43a7cc61c7597cdb1582ede6ea5
        directory: .git-config
        pythonIndex: https://packagefeedproxy.microsoft.io/pypi/simple/
      testScript: |
        param($inputData)
        . (Join-Path $env:PROVISION_MACHINE_ROOT 'scripts\ExternalRepository.ps1')
        $context = $env:PROVISION_MACHINE_CONTEXT
        if ($context -notin @('work', 'personal')) { throw 'Provisioning context is unavailable.' }
        $target = Join-Path $env:USERPROFILE $inputData.directory
        if (-not (Test-GitCheckout -Target $target)) { return $false }
        $marker = Join-Path $env:LOCALAPPDATA 'provision-machine\external-profiles\git-config-context.txt'
        return (Test-Path -LiteralPath $marker) -and
          ((Get-Content -LiteralPath $marker -Raw).Trim() -eq $context)
      setScript: |
        param($inputData)
        $ErrorActionPreference = 'Stop'
        . (Join-Path $env:PROVISION_MACHINE_ROOT 'scripts\ExternalRepository.ps1')
        $context = $env:PROVISION_MACHINE_CONTEXT
        if ($context -notin @('work', 'personal')) { throw 'Provisioning context is unavailable.' }
        $target = Join-Path $env:USERPROFILE $inputData.directory
        Sync-GitCheckout -Target $target -GistId $inputData.gistId
        $env:UV_DEFAULT_INDEX = $inputData.pythonIndex
        $env:UV_PYTHON = Join-Path (& mise where python@3.14) 'python.exe'
        $env:UV_NO_MANAGED_PYTHON = '1'
        $env:PYTHONUTF8 = '1'
        $arguments = @()
        if ($context -eq 'personal') { $arguments += '--no-work' }
        $confirmations = 1..16 | ForEach-Object { 'y' }
        $confirmations | & mise exec --cd $target uv@latest python@3.14 -- `
          uv run --python $env:UV_PYTHON --script (Join-Path $target 'deploy.py') @arguments
        if ($LASTEXITCODE -ne 0) { throw "Git configuration deployment failed with exit code $LASTEXITCODE." }
        $marker = Join-Path $env:LOCALAPPDATA 'provision-machine\external-profiles\git-config-context.txt'
        New-Item -ItemType Directory -Path (Split-Path $marker) -Force | Out-Null
        Set-Content -LiteralPath $marker -Value $context
